<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d1424">
  <title>랜드마크 수호대</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="hud-row">
        <div class="city-info">
          <span id="cityName">서울</span>
          <small id="landmarkName">N서울타워</small>
        </div>
        <div id="timer" class="timer">1:00</div>
        <div class="stage-info">
          <span id="stageText">단계 1/3</span>
          <small id="enemyText">남은 적 0</small>
        </div>
      </div>

      <div id="status" class="status s-ready" role="status" aria-live="polite">
        <span class="dot"></span><span id="statusText">대기 중</span>
      </div>

      <div class="bars">
        <div class="bar">
          <span class="bar-label">🧑‍✈️ 나</span>
          <div class="track"><div id="playerBar" class="fill"></div></div>
          <span id="playerHpText" class="bar-num">100</span>
        </div>
        <div class="bar">
          <span class="bar-label">🏛️ 랜드마크</span>
          <div class="track"><div id="landmarkBar" class="fill"></div></div>
          <span id="landmarkHpText" class="bar-num">100</span>
        </div>
      </div>
    </header>

    <main id="stage">
      <canvas id="game" width="480" height="800" aria-label="게임 화면"></canvas>
      <div id="banner" class="banner"></div>
      <div id="overlay" class="overlay"></div>
    </main>

    <footer id="controls">
      <div class="score-box">
        <small>점수</small>
        <span id="scoreText">0</span>
      </div>
      <div class="hint">화면을 <b>드래그</b>해서 이동<br>사격은 <b>자동</b></div>
      <button id="bombBtn" class="bomb-btn" type="button">💥 폭탄 <span id="bombCount">2</span></button>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
